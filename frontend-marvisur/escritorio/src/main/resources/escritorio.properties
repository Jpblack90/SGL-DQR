# Configuración del Cliente de Escritorio SGL-DQR (Expreso Marvisur)
api.base-url=http://localhost:8080
app.nombre=Expreso Marvisur - Ventanilla SGL-DQR
app.version=1.0.0

# ---- Modo Sin Conexión y Conmutación (RNF-02, O1, O2) ----
