services:
  postgres:
    image: postgres:16-alpine
    container_name: marvisur_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: marvisur_db
      POSTGRES_USER: marvisur
      POSTGRES_PASSWORD: marvisur_dev
    ports:
      - "5432:5432"
    volumes:
      - marvisur_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marvisur -d marvisur_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  marvisur_pgdata:
    driver: local
