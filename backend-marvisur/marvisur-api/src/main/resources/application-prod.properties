# ============================================================
# application-prod.properties — Perfil de Producción
# ============================================================
#
# NOTA DE SEGURIDAD ESTRICTA:
# - No contiene credenciales ni secretos embebidos por defecto.
# - Las variables de entorno son OBLIGATORIAS: la aplicación no arranca si faltan.
# - Swagger UI y OpenAPI docs están deshabilitados.
# ============================================================

# Base de datos PostgreSQL en producción (Variables obligatorias)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway: solo aplica migraciones oficiales de producción (V1 a V8)
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
spring.flyway.validate-on-migrate=true

# Seguridad y JWT (JWT_SECRET es obligatorio y debe tener mínimo 256 bits)
app.jwt.secreto=${JWT_SECRET}
app.jwt.expiracion-minutos=480

# CORS y Portal Web
app.cors.origenes=${CORS_ORIGENES}
app.portal.url-base=${APP_PORTAL_URL_BASE}

# Parámetros operativos
app.almacen.lote-maximo=200
app.entrega.lock-timeout-ms=3000
app.preregistro.vigencia-horas=48
app.publico.limite-por-minuto=30
app.publico.confiar-proxy=true

# Swagger / OpenAPI DESACTIVADOS en producción
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false

# Logging restrictivo
logging.level.root=WARN
logging.level.pe.marvisur=INFO
logging.level.org.springframework.security=WARN
