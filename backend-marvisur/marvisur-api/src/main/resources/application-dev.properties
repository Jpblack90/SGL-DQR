# ============================================================
# application-dev.properties — Perfil de Desarrollo Local
# ============================================================

# Base de datos PostgreSQL local (Docker Compose)
spring.datasource.url=${SPRING_DATASOURCE_URL:${DB_URL:jdbc:postgresql://localhost:5433/marvisur_db}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:marvisur}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:marvisur_dev}}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway: aplica migraciones base (V1-V8) MÁS el seed de desarrollo (V100+)
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration,classpath:db/dev-seed
spring.flyway.baseline-on-migrate=false
spring.flyway.validate-on-migrate=true

# Seguridad y JWT (clave de 256 bits para desarrollo)
app.jwt.secreto=${JWT_SECRET:secreto_para_desarrollo_local_marvisur_256bits_minimo_jwt_key_sgl_dqr_12345}
app.jwt.expiracion-minutos=480

# CORS y Portal Web
app.cors.origenes=${CORS_ORIGENES:http://localhost:5173,http://localhost:3000}
app.portal.url-base=${APP_PORTAL_URL_BASE:http://localhost:5173}

# Parámetros operativos
app.almacen.lote-maximo=200
app.entrega.lock-timeout-ms=3000
app.preregistro.vigencia-horas=48
app.publico.limite-por-minuto=60
app.publico.confiar-proxy=false

# Swagger / OpenAPI activado en desarrollo
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true

# Logging
logging.level.pe.marvisur=DEBUG
logging.level.org.flywaydb=INFO
