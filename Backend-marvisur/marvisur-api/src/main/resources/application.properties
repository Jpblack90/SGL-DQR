# ============================================================
# SGL-DQR — Expreso Marvisur :: Configuración de la API REST
# ============================================================
spring.application.name=marvisur-api

# ---- Servidor ----
server.port=8080

# ---- Fuente de datos PostgreSQL ----
# Credenciales inyectadas por variables de entorno en producción:
# DB_URL, DB_USERNAME, DB_PASSWORD
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/marvisur_db}
spring.datasource.username=${DB_USERNAME:marvisur}
spring.datasource.password=${DB_PASSWORD:marvisur_dev}
spring.datasource.driver-class-name=org.postgresql.Driver

# Pool de conexiones HikariCP
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000

# ---- JPA / Hibernate ----
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ---- Flyway ----
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
spring.flyway.validate-on-migrate=true
spring.flyway.encoding=UTF-8

# ---- Actuator ----
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.info.env.enabled=true

# ---- OpenAPI / Swagger UI ----
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# ---- CORS Configurable ----
app.cors.origenes=${APP_CORS_ORIGENES:http://localhost:5173}

# ---- Seguridad y JWT ----
app.jwt.secreto=${JWT_SECRET:}
app.jwt.expiracion-minutos=480

# ---- Portal Web / Billetera Digital ----
app.portal.url-base=${APP_PORTAL_URL_BASE:http://localhost:5173}

# ---- Logging ----
logging.level.pe.marvisur=INFO
logging.level.org.flywaydb=INFO
logging.level.org.hibernate.SQL=WARN
