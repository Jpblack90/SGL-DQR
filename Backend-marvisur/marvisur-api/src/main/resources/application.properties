# ============================================================
# SGL-DQR — Expreso Marvisur :: Configuración de la API REST
# ============================================================
# IMPORTANTE: Los valores sensibles (contraseña, URL de BD)
# deben sobrescribirse mediante variables de entorno en
# producción. NUNCA se incluyen secretos reales en este archivo.
# ============================================================

spring.application.name=marvisur-api

# ---- Servidor ----
server.port=8080
server.servlet.context-path=/api

# ---- Fuente de datos PostgreSQL ----
# Usar variables de entorno en produccion:
#   DB_URL, DB_USERNAME, DB_PASSWORD
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/marvisur_db}
spring.datasource.username=${DB_USERNAME:marvisur}
spring.datasource.password=${DB_PASSWORD:marvisur_dev}
spring.datasource.driver-class-name=org.postgresql.Driver

# Pool de conexiones HikariCP
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000

# ---- JPA / Hibernate ----
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# Flyway gestiona el esquema; JPA no debe modificarlo
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ---- Flyway ----
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
spring.flyway.validate-on-migrate=true
spring.flyway.encoding=UTF-8

# ---- Logging ----
logging.level.pe.marvisur=INFO
logging.level.org.flywaydb=INFO
logging.level.org.hibernate.SQL=WARN
