# ============================================================
# Perfil de pruebas — H2 en memoria (NO usar en produccion)
# ============================================================

spring.datasource.url=jdbc:h2:mem:marvisur_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;NON_KEYWORDS=VALUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=none

# Flyway en tests: usar directamente las migraciones del classpath principal
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
spring.flyway.validate-on-migrate=true

logging.level.pe.marvisur=DEBUG
logging.level.org.flywaydb=INFO
