# ============================================================
# Perfil de pruebas — H2 en memoria modo PostgreSQL
# ============================================================
spring.datasource.url=jdbc:h2:mem:marvisur_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;NON_KEYWORDS=VALUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway en tests: aplica las migraciones del classpath principal
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
spring.flyway.validate-on-migrate=true

logging.level.pe.marvisur=DEBUG
logging.level.org.flywaydb=INFO

# Seguridad y JWT para pruebas (mínimo 256 bits)
app.jwt.secreto=secreto_de_prueba_para_tests_unitarios_marvisur_256bits_minimo_jwt_key_sgl_dqr_12345
app.jwt.expiracion-minutos=480

# Portal Web para pruebas
app.portal.url-base=http://localhost:5173
