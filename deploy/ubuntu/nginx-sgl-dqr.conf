# SGL-DQR · Sitio de Nginx
# Publica el portal web compilado y reenvía /api a la API (puerto 8080).
# Lo copia deploy/ubuntu/instalar.sh a /etc/nginx/sites-available/sgl-dqr.

server {
    listen 80 default_server;
    server_name _;

    root /var/www/sgl-dqr;
    index index.html;

    # Rutas del portal (React): /rastreo, /billetera, /cotiza... vuelven a index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Peticiones del portal a la API.
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
